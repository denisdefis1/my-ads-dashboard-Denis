<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lagoon Resort — рекламный дашборд</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0c12;
    --card: #12151f;
    --card-2: #171b28;
    --border: #232838;
    --text: #eef1f7;
    --muted: #8991a3;
    --accent: #7c6fe0;
    --accent-2: #a78bfa;
    --green: #6fcf97;
    --orange: #e8985e;
    --blue: #6fa8e8;
    --yellow: #e0c56f;
    --red: #e0706f;
  }
  * { box-sizing: border-box; }
  body {
    background: radial-gradient(1200px 600px at 10% -10%, #171c2c 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 32px;
    max-width: 1280px;
    margin: 0 auto;
  }
  h1 { font-size: 27px; margin: 0 0 4px; background: linear-gradient(90deg, #fff, #b9b3e8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .updated { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
  h2.section-title { font-size: 18px; margin: 44px 0 4px; display: flex; align-items: center; gap: 8px; }
  .section-sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 20px; }
  .preset-btn { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: all .15s; }
  .preset-btn:hover { border-color: var(--accent-2); color: var(--text); }
  .preset-btn.active { background: linear-gradient(135deg, #362f5c, #2a2440); color: var(--text); border-color: var(--accent); }
  .date-input { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 8px; font-size: 13px; font-family: inherit; }

  .quality-bar { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin-bottom: 24px; display: flex; align-items: center; gap: 16px; font-size: 13px; }
  .quality-bar .track { flex: 1; height: 8px; border-radius: 4px; background: #1c2230; overflow: hidden; display: flex; }
  .quality-bar .fill-matched { background: linear-gradient(90deg, var(--green), #4fae78); height: 100%; }
  .quality-bar .fill-unmatched { background: #3a2a2a; height: 100%; }
  .quality-label { color: var(--muted); white-space: nowrap; }
  .quality-label b { color: var(--text); }

  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .cards.secondary { grid-template-columns: repeat(6, 1fr); margin-top: 14px; }
  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .cards.secondary { grid-template-columns: repeat(3, 1fr); }
  }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: #37406020; transform: translateY(-1px); }
  .card .label { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .card .value { font-size: 26px; font-weight: 600; }
  .card .plan-note { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .bar-track { height: 5px; border-radius: 3px; background: #1e2430; margin-top: 10px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 6px; background: #3a3220; color: var(--yellow); }
  .badge.qual { background: #1f3a2c; color: var(--green); }

  .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 16px; }
  .chart-title { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

  .funnel-step { margin-bottom: 16px; }
  .funnel-label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .funnel-bar-track { height: 26px; border-radius: 8px; background: #1a1f2b; overflow: hidden; }
  .funnel-bar-fill { height: 100%; border-radius: 8px; }
  .funnel-drop { color: var(--muted); font-size: 12px; margin-top: 4px; }

  .empty { color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }
</style>
</head>
<body>

  <h1>Lagoon Resort</h1>
  <div class="sub" id="sub">Facebook / Instagram · загрузка...</div>
  <div class="updated" id="updated"></div>

  <div class="controls" id="controls"></div>

  <div class="quality-bar" id="quality-bar"></div>

  <div class="cards" id="main-cards"></div>
  <div class="cards secondary" id="secondary-cards"></div>

  <h2 class="section-title">Динамика по дням</h2>
  <div class="section-sub">Расход, лиды и эффективность за выбранный период</div>
  <div class="chart-card">
    <div class="chart-title">Расход и лиды</div>
    <canvas id="chart-spend-leads" height="90"></canvas>
  </div>
  <div class="grid-2">
    <div class="chart-card">
      <div class="chart-title">Цена лида (CPL)</div>
      <canvas id="chart-cpl" height="110"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-title">CTR</div>
      <canvas id="chart-ctr" height="110"></canvas>
    </div>
  </div>

  <h2 class="section-title">Воронка</h2>
  <div class="section-sub">Показы → Клики → Клики по ссылке → Лиды → Квал-лиды</div>
  <div class="chart-card">
    <div id="funnel"></div>
  </div>

  <div class="empty" style="margin-top:40px;">Кампании, аудитории, демография, устройства, креативы и страны — следующим шагом.</div>

  <script>
    const fmtMoney = (v) => v === null || v === undefined ? '—' : '$' + v.toLocaleString('ru-RU', {maximumFractionDigits: 2});
    const fmtNum = (v) => v === null || v === undefined ? '—' : v.toLocaleString('ru-RU');
    const fmtPct = (v) => v === null || v === undefined ? '—' : v.toFixed(2) + '%';

    let REPORT = null;
    let CRM = null;
    let charts = {};

    async function loadAll() {
      const [reportRes, crmRes] = await Promise.all([
        fetch('data/report.json?t=' + Date.now()),
        fetch('data/crm.json?t=' + Date.now()).catch(() => null),
      ]);
      if (!reportRes.ok) throw new Error('report.json недоступен (' + reportRes.status + ')');
      REPORT = await reportRes.json();
      CRM = (crmRes && crmRes.ok) ? await crmRes.json() : null;

      document.getElementById('updated').textContent = 'данные на ' + REPORT.last_updated +
        (CRM ? ' · CRM на ' + CRM.fetched_at : '');

      renderQualityBar();

      const lastDate = REPORT.account_daily.length
        ? REPORT.account_daily[REPORT.account_daily.length - 1].date
        : REPORT.fetched_range.until;

      renderControls(lastDate);
      selectPreset('30d', lastDate);
    }

    function renderQualityBar() {
      const el = document.getElementById('quality-bar');
      if (!CRM) {
        el.innerHTML = `<span class="quality-label">CRM-данные недоступны — показаны только метрики Meta.</span>`;
        return;
      }
      const matched = CRM.matched_by_ad + CRM.matched_by_campaign + CRM.matched_bridge + CRM.matched_fuzzy;
      el.innerHTML = `
        <span class="quality-label">Сопоставлено с рекламой: <b>${matched} из ${CRM.total_leads}</b> CRM-лидов (${CRM.match_rate}%)</span>
        <div class="track">
          <div class="fill-matched" style="width:${CRM.match_rate}%"></div>
          <div class="fill-unmatched" style="width:${100 - CRM.match_rate}%"></div>
        </div>
        <span class="quality-label">точно: ${CRM.matched_by_ad + CRM.matched_by_campaign} · мост: ${CRM.matched_bridge} · приближённо: ${CRM.matched_fuzzy} · не сматчено: ${CRM.unmatched}</span>
      `;
    }

    function addDays(dateStr, delta) {
      const d = new Date(dateStr + 'T00:00:00');
      d.setDate(d.getDate() + delta);
      return d.toISOString().slice(0, 10);
    }

    function renderControls(lastDate) {
      const presets = [
        { key: '7d', label: '7 дней' },
        { key: '14d', label: '14 дней' },
        { key: '30d', label: '30 дней' },
        { key: 'month', label: 'Этот месяц' },
        { key: 'all', label: 'Всё время' },
      ];
      document.getElementById('controls').innerHTML =
        presets.map(p => `<button class="preset-btn" data-preset="${p.key}">${p.label}</button>`).join('')
        + `<input type="date" class="date-input" id="date-since">`
        + `<span style="color:var(--muted)">–</span>`
        + `<input type="date" class="date-input" id="date-until">`;

      document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.addEventListener('click', () => selectPreset(btn.dataset.preset, lastDate));
      });
      document.getElementById('date-since').addEventListener('change', onCustomDateChange);
      document.getElementById('date-until').addEventListener('change', onCustomDateChange);
    }

    function selectPreset(key, lastDate) {
      let since;
      const until = lastDate;
      if (key === '7d') since = addDays(lastDate, -6);
      else if (key === '14d') since = addDays(lastDate, -13);
      else if (key === '30d') since = addDays(lastDate, -29);
      else if (key === 'month') since = lastDate.slice(0, 8) + '01';
      else since = REPORT.fetched_range.since;

      document.querySelectorAll('.preset-btn').forEach(b => b.classList.toggle('active', b.dataset.preset === key));
      document.getElementById('date-since').value = since;
      document.getElementById('date-until').value = until;
      applyRange(since, until, key);
    }

    function onCustomDateChange() {
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      const since = document.getElementById('date-since').value;
      const until = document.getElementById('date-until').value;
      if (since && until) applyRange(since, until, null);
    }

    function filterDaily(daily, since, until) {
      return daily.filter(d => d.date >= since && d.date <= until);
    }

    function sumDaily(rows) {
      const spend = rows.reduce((s, d) => s + d.spend, 0);
      const leads = rows.reduce((s, d) => s + d.leads, 0);
      const clicks = rows.reduce((s, d) => s + d.clicks, 0);
      const linkClicks = rows.reduce((s, d) => s + (d.link_clicks || 0), 0);
      const impressions = rows.reduce((s, d) => s + d.impressions, 0);
      return {
        spend: Math.round(spend * 100) / 100,
        leads, clicks, linkClicks, impressions,
        cpl: leads ? Math.round(spend / leads * 100) / 100 : null,
        cpm: impressions ? Math.round(spend / impressions * 1000 * 100) / 100 : null,
        cpc: clicks ? Math.round(spend / clicks * 100) / 100 : null,
        ctr: impressions ? Math.round(clicks / impressions * 100 * 100) / 100 : 0,
      };
    }

    function crmLeadsInRange(since, until) {
      if (!CRM) return { total: 0, qualified: 0, notQualified: 0, pending: 0 };
      const rows = CRM.leads.filter(l => {
        if (!l.created_at) return false;
        const d = l.created_at.slice(0, 10);
        return d >= since && d <= until;
      });
      return {
        total: rows.length,
        qualified: rows.filter(l => l.qualified === true).length,
        notQualified: rows.filter(l => l.qualified === false).length,
        pending: rows.filter(l => l.qualified === null).length,
      };
    }

    function applyRange(since, until, presetKey) {
      const accDaily = filterDaily(REPORT.account_daily, since, until);
      const totals = sumDaily(accDaily);
      const reach = presetKey ? REPORT.reach_by_preset[presetKey] : null;
      const crmStats = crmLeadsInRange(since, until);
      const cpql = crmStats.qualified ? Math.round(totals.spend / crmStats.qualified * 100) / 100 : null;

      document.getElementById('sub').textContent = `Facebook / Instagram · ${since} – ${until}`;

      renderMainCards(totals, reach, crmStats, cpql);
      renderSecondaryCards(totals);
      renderDailyCharts(accDaily);
      renderFunnel(totals, crmStats);
    }

    function renderMainCards(t, lifetimeReach, crmStats, cpql) {
      const p = REPORT.plan;
      const budgetPct = Math.min(100, (t.spend / p.monthly_budget) * 100);
      const leadsPct = Math.min(100, (t.leads / p.monthly_leads) * 100);
      const cplOverTarget = t.cpl !== null && t.cpl > p.target_cpl;
      const cplPct = t.cpl !== null ? Math.min(100, (t.cpl / (p.target_cpl * 2)) * 100) : 0;
      const qualRate = crmStats.total ? Math.round(crmStats.qualified / crmStats.total * 1000) / 10 : null;

      const cards = [
        { label: 'Расход', value: fmtMoney(t.spend), note: `план месяца ${fmtMoney(p.monthly_budget)} · ${budgetPct.toFixed(1)}%`, barPct: budgetPct, barColor: 'var(--accent)' },
        { label: 'Лиды (Meta)', value: fmtNum(t.leads), note: `план месяца ${fmtNum(p.monthly_leads)} · ${leadsPct.toFixed(1)}%`, barPct: leadsPct, barColor: 'var(--green)' },
        { label: 'Цена лида (CPL)', value: fmtMoney(t.cpl), note: `цель ≤ ${fmtMoney(p.target_cpl)}` + (cplOverTarget ? ` · <span style="color:var(--orange)">выше цели</span>` : ' · в цели'), barPct: cplPct, barColor: 'var(--orange)' },
        { label: 'Квал-лиды (CRM)', value: CRM ? fmtNum(crmStats.qualified) : '—', note: CRM ? `из ${fmtNum(crmStats.total)} лидов CRM · конверсия ${qualRate ?? '—'}%` : 'CRM не подключена', barPct: null, badge: !CRM ? 'нет данных' : null },
      ];
      document.getElementById('main-cards').innerHTML = cards.map(c => `
        <div class="card">
          <div class="label">${c.label} ${c.badge ? `<span class="badge">${c.badge}</span>` : ''}</div>
          <div class="value">${c.value}</div>
          <div class="plan-note">${c.note}</div>
          ${c.barPct !== null ? `<div class="bar-track"><div class="bar-fill" style="width:${c.barPct}%; background:${c.barColor}"></div></div>` : ''}
        </div>`).join('');

      const secondRow = [
        { label: 'Цена квал-лида (CPQL)', value: CRM ? fmtMoney(cpql) : '—' },
        { label: 'Показы', value: fmtNum(t.impressions) },
        { label: 'Охват' + (lifetimeReach === null ? ' (только для кнопок периода)' : ''), value: lifetimeReach !== null ? fmtNum(lifetimeReach) : '—' },
        { label: 'Клики / по ссылке', value: `${fmtNum(t.clicks)} / ${fmtNum(t.linkClicks)}` },
      ];
      document.getElementById('main-cards').innerHTML += secondRow.map(c => `
        <div class="card">
          <div class="label">${c.label}</div>
          <div class="value" style="font-size:20px">${c.value}</div>
        </div>`).join('');
    }

    function renderSecondaryCards(t) {
      const cards = [
        { label: 'CPM', value: fmtMoney(t.cpm) },
        { label: 'CPC', value: fmtMoney(t.cpc) },
        { label: 'CTR', value: fmtPct(t.ctr) },
        { label: 'Клики', value: fmtNum(t.clicks) },
        { label: 'Клики по ссылке', value: fmtNum(t.linkClicks) },
        { label: 'CTR по ссылке', value: t.impressions ? fmtPct(Math.round(t.linkClicks / t.impressions * 10000) / 100) : '—' },
      ];
      document.getElementById('secondary-cards').innerHTML = cards.map(c => `
        <div class="card">
          <div class="label">${c.label}</div>
          <div class="value">${c.value}</div>
        </div>`).join('');
    }

    function destroyCharts() { Object.values(charts).forEach(c => c && c.destroy()); charts = {}; }

    function renderDailyCharts(daily) {
      destroyCharts();
      const labels = daily.map(d => d.date.slice(5).split('-').reverse().join('.'));
      const gridColor = '#1c2230';
      const scalesX = { grid: { color: gridColor }, ticks: { color: '#8992a3', font: { size: 11 } } };

      charts.spendLeads = new Chart(document.getElementById('chart-spend-leads'), {
        data: {
          labels,
          datasets: [
            { type: 'bar', label: 'Лиды', data: daily.map(d => d.leads), backgroundColor: '#6fcf97', yAxisID: 'y1', borderRadius: 4, maxBarThickness: 26 },
            { type: 'line', label: 'Расход', data: daily.map(d => d.spend), borderColor: '#7c6fe0', backgroundColor: 'rgba(124,111,224,0.15)', fill: true, tension: 0.4, yAxisID: 'y', pointRadius: 0 },
          ],
        },
        options: {
          responsive: true, plugins: { legend: { display: false } },
          scales: {
            x: scalesX,
            y: { position: 'left', grid: { color: gridColor }, ticks: { color: '#8992a3', callback: v => '$' + v } },
            y1: { position: 'right', grid: { display: false }, ticks: { color: '#8992a3' } },
          },
        },
      });

      charts.cpl = new Chart(document.getElementById('chart-cpl'), {
        type: 'line',
        data: { labels, datasets: [{ data: daily.map(d => d.leads ? Math.round(d.spend / d.leads * 100) / 100 : null), borderColor: '#e0c56f', tension: 0.4, pointRadius: 0, spanGaps: true }] },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: scalesX, y: { grid: { color: gridColor }, ticks: { color: '#8992a3', callback: v => '$' + v } } } },
      });

      charts.ctr = new Chart(document.getElementById('chart-ctr'), {
        type: 'line',
        data: { labels, datasets: [{ data: daily.map(d => d.impressions ? Math.round(d.clicks / d.impressions * 100 * 100) / 100 : 0), borderColor: '#6fa8e8', tension: 0.4, pointRadius: 0 }] },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: scalesX, y: { grid: { color: gridColor }, ticks: { color: '#8992a3', callback: v => v + '%' } } } },
      });
    }

    function renderFunnel(t, crmStats) {
      const steps = [
        { label: 'Показы', value: t.impressions, color: 'var(--blue)', drop: `↓ CTR ${fmtPct(t.ctr)}` },
        { label: 'Клики', value: t.clicks, color: '#8b7de0', drop: t.clicks ? `↓ Клик → по ссылке ${(t.linkClicks / t.clicks * 100).toFixed(1)}%` : '' },
        { label: 'Клики по ссылке', value: t.linkClicks, color: 'var(--accent)', drop: t.linkClicks ? `↓ По ссылке → лид ${(t.leads / t.linkClicks * 100).toFixed(1)}%` : '' },
        { label: 'Лиды (Meta)', value: t.leads, color: 'var(--green)', drop: CRM ? `↓ Лид → квал ${crmStats.total ? (crmStats.qualified / crmStats.total * 100).toFixed(1) : '—'}%` : '' },
      ];
      const max = t.impressions || 1;
      let html = steps.map(s => `
        <div class="funnel-step">
          <div class="funnel-label"><span>${s.label}</span><span>${fmtNum(s.value)}</span></div>
          <div class="funnel-bar-track"><div class="funnel-bar-fill" style="width:${(s.value / max * 100)}%; background:${s.color}"></div></div>
          ${s.drop ? `<div class="funnel-drop">${s.drop}</div>` : ''}
        </div>`).join('');

      html += `
        <div class="funnel-step">
          <div class="funnel-label"><span>Квал-лиды (CRM) ${!CRM ? '<span class=\"badge\">нет данных</span>' : ''}</span><span>${CRM ? fmtNum(crmStats.qualified) : '—'}</span></div>
          <div class="funnel-bar-track"><div class="funnel-bar-fill" style="width:${CRM && t.impressions ? (crmStats.qualified / max * 100) : 0}%; background:var(--green)"></div></div>
        </div>`;

      document.getElementById('funnel').innerHTML = html;
    }

    loadAll().catch(err => {
      document.getElementById('sub').textContent = 'Ошибка загрузки данных: ' + err.message;
    });
  </script>
</body>
</html>
