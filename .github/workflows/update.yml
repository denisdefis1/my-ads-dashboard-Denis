name: Update Facebook Ads report

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Meta report (must not block CRM fetch)
        id: report
        continue-on-error: true
        env:
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_ACT_ID: ${{ secrets.FACEBOOK_ACT_ID }}
        run: python fetch_report.py

      - name: Fetch CRM (must succeed, runs even if the report fetch failed)
        id: crm
        run: python fetch_crm.py

      - name: Commit and push updated data
        if: always() && (steps.report.outcome == 'success' || steps.crm.outcome == 'success')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/report.json data/crm.json
          git diff --quiet --cached || git commit -m "auto: update report $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Fail workflow if the Meta report fetch failed
        if: always() && steps.report.outcome == 'failure'
        run: |
          echo "::warning::fetch_report.py failed this run — Meta report data is stale, but CRM was refreshed independently."
          exit 1
