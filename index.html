<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Ads Dashboard</title>
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-card: #161b22;
            --border: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --success: #2ea44f;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; 
            background: var(--bg-main); 
            color: var(--text-main); 
            margin: 0; 
            padding: 30px;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }
        h1 { margin: 0; font-size: 24px; font-weight: 600; }
        
        /* Кнопки и Календарь */
        .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        button { 
            background: var(--bg-card); 
            color: var(--text-main); 
            border: 1px solid var(--border); 
            padding: 6px 14px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 14px;
            transition: 0.2s;
        }
        button:hover, button.active { 
            background: #21262d; 
            border-color: var(--text-muted); 
        }
        button.active {
            border-color: var(--accent);
            color: var(--accent);
        }
        .calendar-group { display: flex; gap: 8px; align-items: center; margin-left: 15px; font-size: 14px; color: var(--text-muted); }
        input[type="date"] { 
            background: var(--bg-main); 
            color: var(--text-main); 
            border: 1px solid var(--border); 
            padding: 5px 10px; 
            border-radius: 6px; 
            outline: none;
        }

        /* Виджеты метрик */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 30px; }
        .stat-card { 
            background: var(--bg-card); 
            padding: 20px; 
            border-radius: 6px; 
            border: 1px solid var(--border); 
        }
        .stat-card h3 { margin: 0 0 8px 0; font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 26px; font-weight: 600; color: #f0f6fc; }

        /* Таблица */
        .table-container { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background: #1f242c; color: var(--text-muted); font-weight: 500; padding: 12px 16px; border-bottom: 1px solid var(--border); }
        td { padding: 14px 16px; border-bottom: 1px solid var(--border); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(88, 166, 255, 0.03); }
        .camp-name { font-weight: 500; color: var(--accent); }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Meta Ads Analytics</h1>
        <div class="controls">
            <button onclick="setPeriod(1, this)">1 день</button>
            <button onclick="setPeriod(7, this)">7 дней</button>
            <button onclick="setPeriod(30, this)">30 дней</button>
            <button onclick="setPeriod('all', this)" class="active">Все время</button>
            
            <div class="calendar-group">
                <span>С</span> <input type="date" id="dateFrom" onchange="manualDateChange()">
                <span>По</span> <input type="date" id="dateTo" onchange="manualDateChange()">
            </div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><h3>Расход всего</h3><div class="value" id="totalSpend">$0.00</div></div>
        <div class="stat-card"><h3>Клики по ссылкам</h3><div class="value" id="totalClicks">0</div></div>
        <div class="stat-card"><h3>Результаты (Лиды)</h3><div class="value" id="totalLeads">0</div></div>
        <div class="stat-card"><h3>CPA (Цена лида)</h3><div class="value" id="totalCPA">$0.00</div></div>
    </div>

    <div class="table-container">
        <table id="campaignsTable">
            <thead>
                <tr>
                    <th>Название кампании</th>
                    <th>Расход</th>
                    <th>Показы</th>
                    <th>Клики</th>
                    <th>Лиды</th>
                    <th>Покупки</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        let rawData = [];
        const START_DATE = new Date('2026-03-09'); 

        fetch('data/report.json')
            .then(res => res.json())
            .then(data => {
                rawData = data;
                document.getElementById('dateFrom').value = '2026-03-09';
                document.getElementById('dateTo').value = new Date().toISOString().split('T')[0];
                updateDashboard();
            })
            .catch(err => console.error("Ошибка загрузки данных:", err));

        function setPeriod(days, btn) {
            document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const today = new Date();
            let fromDate = new Date();

            if (days === 'all') {
                fromDate = START_DATE;
            } else {
                fromDate.setDate(today.getDate() - days);
                if (fromDate < START_DATE) fromDate = START_DATE;
            }

            document.getElementById('dateFrom').value = fromDate.toISOString().split('T')[0];
            document.getElementById('dateTo').value = today.toISOString().split('T')[0];
            updateDashboard();
        }

        function manualDateChange() {
            document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
            updateDashboard();
        }

        function updateDashboard() {
            const from = new Date(document.getElementById('dateFrom').value);
            const to = new Date(document.getElementById('dateTo').value);
            to.setHours(23, 59, 59, 999);

            const filtered = rawData.filter(item => {
                const itemDate = new Date(item.date);
                return itemDate >= from && itemDate <= to;
            });

            const campaignMap = {};
            let totalSpend = 0, totalClicks = 0, totalLeads = 0;

            filtered.forEach(item => {
                totalSpend += item.spend;
                totalClicks += item.clicks;
                totalLeads += item.leads;

                if (!campaignMap[item.id]) {
                    campaignMap[item.id] = { name: item.name, spend: 0, impressions: 0, clicks: 0, leads: 0, purchases: 0 };
                }
                campaignMap[item.id].spend += item.spend;
                campaignMap[item.id].impressions += item.impressions;
                campaignMap[item.id].clicks += item.clicks;
                campaignMap[item.id].leads += item.leads;
                campaignMap[item.id].purchases += item.purchases;
            });

            document.getElementById('totalSpend').innerText = `$${totalSpend.toFixed(2)}`;
            document.getElementById('totalClicks').innerText = totalClicks.toLocaleString();
            document.getElementById('totalLeads').innerText = totalLeads.toLocaleString();
            
            const cpa = totalLeads > 0 ? (totalSpend / totalLeads) : 0;
            document.getElementById('totalCPA').innerText = `$${cpa.toFixed(2)}`;

            const tbody = document.querySelector('#campaignsTable tbody');
            tbody.innerHTML = '';

            Object.values(campaignMap).forEach(c => {
                if (c.spend > 0 || c.clicks > 0) {
                    const row = `<tr>
                        <td class="camp-name">${c.name}</td>
                        <td>$${c.spend.toFixed(2)}</td>
                        <td>${c.impressions.toLocaleString()}</td>
                        <td>${c.clicks}</td>
                        <td>${c.leads}</td>
                        <td>${c.purchases}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                }
            });
        }
    </script>
</body>
</html>
