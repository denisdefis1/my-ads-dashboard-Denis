name: Update Facebook Ads report

on:
  schedule:
    # Автоматический запуск каждые 3 часа
    - cron: '0 */3 * * *'
  workflow_dispatch:
    # Позволяет запускать обновление вручную кнопкой в интерфейсе GitHub

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run fetch script
        env:
          # Связываем ваши секреты из GitHub с переменными для Python-скрипта
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FB_AD_ACCOUNT_ID: ${{ secrets.FACEBOOK_ACT_ID }}
        run: python fetch_report.py

      - name: Commit updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add data/report.json
          # Проверяем, изменились ли данные, чтобы не делать пустых коммитов
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update report $(date -u +'%Y-%m-%d %H:%M') UTC" && git push)
