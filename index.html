<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook / Instagram Ads — отчёт</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0e14;
    --card: #12161f;
    --card-2: #161b26;
    --border: #232a38;
    --text: #e8edf5;
    --muted: #8992a3;
    --accent: #7c6fe0;
    --green: #6fcf97;
    --orange: #e8985e;
    --blue: #6fa8e8;
    --yellow: #e0c56f;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 32px;
    max-width: 1200px;
    margin: 0 auto;
  }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .updated { color: var(--muted); font-size: 12px; margin-bottom: 28px; }
  h2.section-title { font-size: 18px; margin: 40px 0 4px; }
  .section-sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  .cards.secondary { grid-template-columns: repeat(6, 1fr); margin-top: 14px; }
  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .cards.secondary { grid-template-columns: repeat(3, 1fr); }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }
  .card .label {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card .value { font-size: 26px; font-weight: 600; }
  .card .plan-note { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .bar-track {
    height: 5px;
    border-radius: 3px;
    background: #1e2430;
    margin-top: 10px;
    overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 3px; }
  .badge {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 6px;
    background: #3a3220;
    color: var(--yellow);
  }
  .chart-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-top: 16px;
  }
  .chart-title { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 16px;
  }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

  .funnel-step { margin-bottom: 16px; }
  .funnel-label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .funnel-bar-track { height: 28px; border-radius: 8px; background: #1a1f2b; overflow: hidden; }
  .funnel-bar-fill { height: 100%; border-radius: 8px; }
  .funnel-drop { color: var(--muted); font-size: 12px; margin-top: 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 400; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  td.num, th.num { text-align: right; }
  .lang-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

  .creatives-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
  }
  @media (max-width: 1000px) { .creatives-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 600px) { .creatives-grid { grid-template-columns: repeat(2, 1fr); } }
  .creative-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .creative-thumb {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: var(--card-2) center/cover no-repeat;
  }
  .creative-info { padding: 10px; }
  .creative-name { font-size: 12px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .creative-stats { display: flex; justify-content: space-between; font-size: 12px; }
  .creative-stats .leads { color: var(--green); font-weight: 600; }

  .empty { color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }
</style>
</head>
<body>

  <h1>Lagoon Resort</h1>
  <div class="sub" id="sub">Facebook / Instagram · загрузка...</div>
  <div class="updated" id="updated"></div>

  <div class="cards" id="main-cards"></div>
  <div class="cards secondary" id="secondary-cards"></div>

  <h2 class="section-title">Динамика по дням</h2>
  <div class="section-sub">Расход, лиды и эффективность за выбранный период</div>

  <div class="chart-card">
    <div class="chart-title">Расход и лиды</div>
    <canvas id="chart-spend-leads" height="90"></canvas>
  </div>

  <div class="grid-2">
    <div class="chart-card">
      <div class="chart-title">Цена лида (CPL)</div>
      <canvas id="chart-cpl" height="110"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-title">CTR</div>
      <canvas id="chart-ctr" height="110"></canvas>
    </div>
  </div>

  <div class="grid-2">
    <div class="chart-card">
      <div class="chart-title">Воронка</div>
      <div id="funnel"></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Потоки EN / RU</div>
      <div class="bar-track" style="height:6px; margin-bottom:16px;" id="flow-bar"></div>
      <table>
        <thead><tr><th>Поток</th><th class="num">Расход</th><th class="num">Доля</th><th class="num">Лиды</th><th class="num">CPL</th><th class="num">CTR</th></tr></thead>
        <tbody id="flows-body"></tbody>
      </table>
    </div>
  </div>

  <h2 class="section-title">Кампании</h2>
  <div class="section-sub">Сортировка по расходу</div>
  <div class="chart-card" style="padding:8px 12px;">
    <table>
      <thead><tr><th>Кампания</th><th class="num">Расход</th><th class="num">Лиды</th><th class="num">CPL</th><th class="num">CTR</th></tr></thead>
      <tbody id="campaigns-body"></tbody>
    </table>
  </div>

  <h2 class="section-title">Креативы</h2>
  <div class="section-sub" id="creatives-sub">Сортировка по лидам</div>
  <div class="creatives-grid" id="creatives-grid"></div>

  <script>
    const fmtMoney = (v) => v === null || v === undefined ? '—' : '$' + v.toLocaleString('ru-RU', {maximumFractionDigits: 2});
    const fmtNum = (v) => v === null || v === undefined ? '—' : v.toLocaleString('ru-RU');
    const fmtPct = (v) => v === null || v === undefined ? '—' : v.toFixed(2) + '%';
    const LANG_COLORS = { EN: 'var(--blue)', RU: 'var(--orange)' };

    async function loadReport() {
      const res = await fetch('data/report.json?t=' + Date.now());
      if (!res.ok) throw new Error('report.json недоступен (' + res.status + ')');
      const data = await res.json();

      document.getElementById('sub').textContent =
        `Facebook / Instagram · весь период · ${data.period.since} – ${data.period.until}`;
      document.getElementById('updated').textContent = 'данные на ' + data.last_updated;

      renderMainCards(data);
      renderSecondaryCards(data);
      renderCharts(data.daily);
      renderFunnel(data.totals);
      renderFlows(data.flows, data.totals.spend);
      renderCampaigns(data.campaigns);
      renderCreatives(data.creatives);
    }

    function renderMainCards(data) {
      const t = data.totals, p = data.plan;
      const budgetPct = Math.min(100, (t.spend / p.monthly_budget) * 100);
      const leadsPct = Math.min(100, (t.leads / p.monthly_leads) * 100);
      const cplOverTarget = t.cpl !== null && t.cpl > p.target_cpl;
      const cplPct = t.cpl !== null ? Math.min(100, (t.cpl / (p.target_cpl * 2)) * 100) : 0;

      const cards = [
        { label: 'Расход', value: fmtMoney(t.spend),
          note: `план месяца ${fmtMoney(p.monthly_budget)} · ${budgetPct.toFixed(1)}%`,
          barPct: budgetPct, barColor: 'var(--accent)' },
        { label: 'Лиды', value: fmtNum(t.leads),
          note: `план месяца ${fmtNum(p.monthly_leads)} · ${leadsPct.toFixed(1)}%`,
          barPct: leadsPct, barColor: 'var(--green)' },
        { label: 'Цена лида (CPL)', value: fmtMoney(t.cpl),
          note: `цель ≤ ${fmtMoney(p.target_cpl)}` + (cplOverTarget ? ` · <span style="color:var(--orange)">выше цели</span>` : ' · в цели'),
          barPct: cplPct, barColor: 'var(--orange)' },
        { label: 'Охват периода', value: fmtNum(t.impressions),
          note: `Клики ${fmtNum(t.clicks)} · CTR ${fmtPct(t.ctr)}`,
          barPct: null },
      ];

      document.getElementById('main-cards').innerHTML = cards.map(c => `
        <div class="card">
          <div class="label">${c.label}</div>
          <div class="value">${c.value}</div>
          <div class="plan-note">${c.note}</div>
          ${c.barPct !== null ? `<div class="bar-track"><div class="bar-fill" style="width:${c.barPct}%; background:${c.barColor}"></div></div>` : ''}
        </div>
      `).join('');
    }

    function renderSecondaryCards(data) {
      const t = data.totals;
      const cards = [
        { label: 'CPM', value: fmtMoney(t.cpm) },
        { label: 'CPC', value: fmtMoney(t.cpc) },
        { label: 'CTR', value: fmtPct(t.ctr) },
        { label: 'Клики', value: fmtNum(t.clicks) },
        { label: 'Квал-лиды', value: '—', badge: 'ждёт CRM' },
        { label: 'Цена квал-лида', value: '—', badge: 'ждёт CRM' },
      ];
      document.getElementById('secondary-cards').innerHTML = cards.map(c => `
        <div class="card">
          <div class="label">${c.label} ${c.badge ? `<span class="badge">${c.badge}</span>` : ''}</div>
          <div class="value">${c.value}</div>
        </div>
      `).join('');
    }

    function renderCharts(daily) {
      const labels = daily.map(d => d.date.slice(5).split('-').reverse().join('.'));
      const gridColor = '#1c2230';
      const commonScales = {
        x: { grid: { color: gridColor }, ticks: { color: '#8992a3', font: { size: 11 } } },
      };

      new Chart(document.getElementById('chart-spend-leads'), {
        data: {
          labels,
          datasets: [
            { type: 'bar', label: 'Лиды', data: daily.map(d => d.leads), backgroundColor: '#6fcf97', yAxisID: 'y1', borderRadius: 4, maxBarThickness: 26 },
            { type: 'line', label: 'Расход', data: daily.map(d => d.spend), borderColor: '#7c6fe0', backgroundColor: 'rgba(124,111,224,0.15)', fill: true, tension: 0.4, yAxisID: 'y', pointRadius: 0 },
          ],
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            ...commonScales,
            y: { position: 'left', grid: { color: gridColor }, ticks: { color: '#8992a3', callback: v => '$' + v } },
            y1: { position: 'right', grid: { display: false }, ticks: { color: '#8992a3' } },
          },
        },
      });

      new Chart(document.getElementById('chart-cpl'), {
        type: 'line',
        data: { labels, datasets: [{ data: daily.map(d => d.cpl), borderColor: '#e0c56f', tension: 0.4, pointRadius: 0, spanGaps: true }] },
        options: { responsive: true, plugins: { legend: { display: false } },
          scales: { ...commonScales, y: { grid: { color: gridColor }, ticks: { color: '#8992a3', callback: v => '$' + v } } } },
      });

      new Chart(document.getElementById('chart-ctr'), {
        type: 'line',
        data: { labels, datasets: [{ data: daily.map(d => d.ctr), borderColor: '#6fa8e8', tension: 0.4, pointRadius: 0 }] },
        options: { responsive: true, plugins: { legend: { display: false } },
          scales: { ...commonScales, y: { grid: { color: gridColor }, ticks: { color: '#8992a3', callback: v => v + '%' } } } },
      });
    }

    function renderFunnel(t) {
      const steps = [
        { label: 'Показы', value: t.impressions, color: 'var(--blue)', drop: `↓ CTR ${fmtPct(t.ctr)}` },
        { label: 'Клики', value: t.clicks, color: 'var(--accent)', drop: t.clicks ? `↓ Клик → лид ${(t.leads / t.clicks * 100).toFixed(2)}%` : '' },
        { label: 'Лиды', value: t.leads, color: 'var(--green)', drop: '' },
      ];
      const max = t.impressions || 1;
      document.getElementById('funnel').innerHTML = steps.map(s => `
        <div class="funnel-step">
          <div class="funnel-label"><span>${s.label}</span><span>${fmtNum(s.value)}</span></div>
          <div class="funnel-bar-track"><div class="funnel-bar-fill" style="width:${(s.value / max * 100)}%; background:${s.color}"></div></div>
          ${s.drop ? `<div class="funnel-drop">${s.drop}</div>` : ''}
        </div>
      `).join('') + `
        <div class="funnel-step">
          <div class="funnel-label"><span>Квал-лиды <span class="badge">ждёт CRM</span></span><span>—</span></div>
          <div class="funnel-bar-track"></div>
        </div>`;
    }

    function renderFlows(flows, totalSpend) {
      if (!flows || !flows.length) {
        document.getElementById('flows-body').innerHTML = `<tr><td colspan="6" class="empty">Нет данных по языковым потокам</td></tr>`;
        return;
      }
      document.getElementById('flow-bar').innerHTML = flows.map(f =>
        `<div style="display:inline-block; height:6px; width:${f.share}%; background:${LANG_COLORS[f.language] || 'var(--muted)'}"></div>`
      ).join('');
      document.getElementById('flows-body').innerHTML = flows.map(f => `
        <tr>
          <td><span class="lang-dot" style="background:${LANG_COLORS[f.language] || 'var(--muted)'}"></span>${f.language}</td>
          <td class="num">${fmtMoney(f.spend)}</td>
          <td class="num">${f.share}%</td>
          <td class="num">${fmtNum(f.leads)}</td>
          <td class="num">${fmtMoney(f.cpl)}</td>
          <td class="num">${fmtPct(f.ctr)}</td>
        </tr>
      `).join('');
    }

    function renderCampaigns(campaigns) {
      if (!campaigns || !campaigns.length) {
        document.getElementById('campaigns-body').innerHTML = `<tr><td colspan="5" class="empty">Нет данных по кампаниям</td></tr>`;
        return;
      }
      document.getElementById('campaigns-body').innerHTML = campaigns.map(c => `
        <tr>
          <td><span class="lang-dot" style="background:${LANG_COLORS[c.language] || 'var(--muted)'}"></span>${c.name}</td>
          <td class="num">${fmtMoney(c.spend)}</td>
          <td class="num">${fmtNum(c.leads)}</td>
          <td class="num">${fmtMoney(c.cpl)}</td>
          <td class="num">${fmtPct(c.ctr)}</td>
        </tr>
      `).join('');
    }

    function renderCreatives(creatives) {
      if (!creatives || !creatives.length) {
        document.getElementById('creatives-grid').innerHTML = `<div class="empty">Нет данных по объявлениям</div>`;
        return;
      }
      document.getElementById('creatives-sub').textContent = `${creatives.length} объявлений за период`;
      document.getElementById('creatives-grid').innerHTML = creatives.map(c => `
        <div class="creative-card">
          <div class="creative-thumb" style="${c.thumbnail_url ? `background-image:url('${c.thumbnail_url}')` : ''}"></div>
          <div class="creative-info">
            <div class="creative-name" title="${c.name}">${c.name}</div>
            <div class="creative-stats">
              <span class="leads">${fmtNum(c.leads)} лид.</span>
              <span>${fmtMoney(c.cpl)}</span>
              <span>${fmtPct(c.ctr)}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    loadReport().catch(err => {
      document.getElementById('sub').textContent = 'Ошибка загрузки данных: ' + err.message;
    });
  </script>
</body>
</html>
